  <path d="M30 15 L33 23" stroke="#070a13" stroke-width="2.5" stroke-linecap="round" />
  <path d="M38 12.5 L41 20.5" stroke="#070a13" stroke-width="2.5" stroke-linecap="round" />
  <!-- Play triangle / media symbol -->
